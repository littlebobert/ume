<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ume</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="app-icon" src="icons/icon-128.png" alt="">
        <div>
          <h1>Ume</h1>
          <p>Fill in web forms automatically.</p>
        </div>
      </header>

      <section id="get-started" class="get-started" hidden>
        <h2>Finish setting up Ume</h2>
        <p>Add an AI provider and API key in the Ume app before using the Safari extension.</p>
        <button id="open-app" class="primary" type="button">Open Ume</button>
      </section>

      <div id="ready-content" hidden>
      <div class="actions">
        <button id="learn" type="button">Remember my answers</button>
        <button id="fill" type="button">Fill this form</button>
      </div>

      <div id="activity" class="activity" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="activity-label">Working…</span>
      </div>
      </div>

      <p id="status" role="status" aria-live="polite"></p>

      <footer>
        <div class="footer-buttons">
          <button id="open-debug-log" class="settings-button" type="button">Debug Logs…</button>
          <button id="open-settings" class="settings-button" type="button">Settings…</button>
        </div>
      </footer>

      <section id="debug-log-panel" class="debug-log-panel" hidden>
        <div class="debug-log-header">
          <strong>Extension Debug Logs</strong>
          <button id="close-debug-log" class="icon-button" type="button" aria-label="Close">Done</button>
        </div>
        <p class="debug-log-note">Logs can include page URLs and form labels. Review them before sharing; Ume never sends them automatically.</p>
        <textarea id="debug-log-text" readonly spellcheck="false"></textarea>
        <div class="debug-log-actions">
          <button id="delete-debug-log" type="button">Delete Log</button>
          <div class="debug-log-share-actions">
            <button id="copy-debug-log" type="button">Copy</button>
            <button id="email-debug-log" type="button">Email Logs…</button>
          </div>
        </div>
      </section>
    </main>
    <script src="lib/matcher.js"></script>
    <script src="lib/debug-email.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
