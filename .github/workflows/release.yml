name: Release Ume

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 0.1.2). Leave blank to increment the latest release tag's patch version.
        required: false
        type: string
      changelog_en:
        description: Short English changelog note for GitHub and the Ume landing page.
        required: false
        type: string
      changelog_ja:
        description: Optional Japanese note. Leave blank to translate the English note with OpenAI.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-ume
  cancel-in-progress: false

jobs:
  release:
    name: Sign and release Ume
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release

    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_OPT_OUT_USAGE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${REQUESTED_VERSION#v}"
          if [[ -z "$version" ]]; then
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | sed -n '1p')"
            if [[ -z "$latest_tag" ]]; then
              version="1.0.1"
            else
              latest_version="${latest_tag#v}"
              IFS=. read -r major minor patch <<< "$latest_version"
              version="$major.$minor.$((patch + 1))"
            fi
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use semantic version format such as 0.1.2." >&2
            exit 1
          fi

          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "Releasing Ume $version"

      - name: Verify publication credentials
        env:
          WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$WEBSITE_REPO_TOKEN" ]]; then
            echo "WEBSITE_REPO_TOKEN must be configured in the release environment." >&2
            exit 1
          fi
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY must be configured for signed macOS updates." >&2
            exit 1
          fi

      - name: Prepare localized changelog note
        id: changelog
        env:
          RELEASE_NOTE_EN: ${{ inputs.changelog_en }}
          RELEASE_NOTE_JA: ${{ inputs.changelog_ja }}
          CHANGELOG_OPENAI_API_KEY: ${{ secrets.CHANGELOG_OPENAI_API_KEY }}
          CHANGELOG_OPENAI_MODEL: ${{ vars.CHANGELOG_OPENAI_MODEL || 'gpt-5.6-sol' }}
          CHANGELOG_OPENAI_REASONING_EFFORT: ${{ vars.CHANGELOG_OPENAI_REASONING_EFFORT || 'medium' }}
        run: ruby scripts/translate_release_note.rb

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and upload iOS app to TestFlight
        run: >-
          bundle exec fastlane ios release
          version:${{ steps.version.outputs.version }}
          build_number:${{ steps.version.outputs.build_number }}

      - name: Build signed macOS app
        run: >-
          bundle exec fastlane mac release
          version:${{ steps.version.outputs.version }}
          build_number:${{ steps.version.outputs.build_number }}

      - name: Notarize and package macOS app
        id: macos
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          app_path="build/macos/Ume.app"
          submission_zip="$RUNNER_TEMP/Ume-notarization.zip"
          dmg_root="$RUNNER_TEMP/Ume-dmg"
          release_dmg="build/Ume-$VERSION-macOS.dmg"
          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          test -d "$app_path"
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$submission_zip"
          xcrun notarytool submit "$submission_zip" \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

          mkdir -p "$dmg_root"
          ditto "$app_path" "$dmg_root/Ume.app"
          ln -s /Applications "$dmg_root/Applications - Drag Ume Here"
          cat > "$dmg_root/READ ME - Install Ume.txt" <<'INSTRUCTIONS'
          Install Ume
          ===========

          1. Drag Ume.app onto "Applications - Drag Ume Here".
          2. Open Ume from your Applications folder.
          3. Follow Ume's setup steps to enable the extension in Safari.

          Ume's Safari extension may not appear or open correctly until the app
          has been moved to Applications and reopened from there.
          INSTRUCTIONS
          diskutil image create from \
            --volumeName "Install Ume" \
            --format UDZO \
            "$dmg_root" \
            "$release_dmg"

          xcrun notarytool submit "$release_dmg" \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple "$release_dmg"
          xcrun stapler validate "$release_dmg"

          echo "archive=$release_dmg" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ume ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.release_body }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.macos.outputs.archive }}

      - name: Check out landing-page repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: littlebobert/littlebobert.github.io
          ref: master
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Update and publish Ume landing page and appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTE_EN: ${{ steps.changelog.outputs.note_en }}
          NOTE_JA: ${{ steps.changelog.outputs.note_ja }}
          DMG_PATH: ${{ steps.macos.outputs.archive }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ruby scripts/update_landing_page.rb \
            --file website/ume.html \
            --version "$VERSION" \
            --download-url "https://github.com/littlebobert/ume/releases/download/$TAG/Ume-$VERSION-macOS.dmg" \
            --note-en "$NOTE_EN" \
            --note-ja "$NOTE_JA"

          sparkle_archive="$RUNNER_TEMP/Sparkle-2.9.5.zip"
          sparkle_dir="$RUNNER_TEMP/Sparkle-2.9.5"
          updates_dir="$RUNNER_TEMP/Ume-sparkle-updates"
          curl -L --fail --silent --show-error \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-for-Swift-Package-Manager.zip \
            -o "$sparkle_archive"
          printf '34b9b2071f3de0012eca3faa3a9290bb94e62131e9a74f6dc91514a000097a6c  %s\n' "$sparkle_archive" | shasum -a 256 -c -
          mkdir -p "$sparkle_dir" "$updates_dir"
          unzip -q "$sparkle_archive" -d "$sparkle_dir"
          cp "$DMG_PATH" "$updates_dir/Ume-$VERSION-macOS.dmg"
          if [[ -f website/ume-appcast.xml ]]; then
            cp website/ume-appcast.xml "$updates_dir/ume-appcast.xml"
          fi
          ruby scripts/write_sparkle_release_notes.rb \
            --dir "$updates_dir" \
            --version "$VERSION" \
            --note-en "$NOTE_EN" \
            --note-ja "$NOTE_JA"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_dir/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/littlebobert/ume/releases/download/$TAG/" \
            --release-notes-url-prefix https://littlebobert.github.io/ \
            --full-release-notes-url https://littlebobert.github.io/ume.html#changelog \
            --link https://littlebobert.github.io/ume.html \
            --embed-release-notes \
            --maximum-versions 10 \
            --maximum-deltas 0 \
            -o "$updates_dir/ume-appcast.xml" \
            "$updates_dir"
          cp "$updates_dir/ume-appcast.xml" website/ume-appcast.xml
          website_notes=()
          for note in "$updates_dir"/Ume-"$VERSION"-macOS.*.md; do
            [[ -f "$note" ]] || continue
            note_name="${note##*/}"
            cp "$note" "website/$note_name"
            website_notes+=("$note_name")
          done

          git -C website config user.name "Ume Release Bot"
          git -C website config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C website add ume.html ume-appcast.xml "${website_notes[@]}"
          if git -C website diff --cached --quiet; then
            echo "Landing page is already current."
          else
            git -C website commit -m "Update Ume for $TAG"
            git -C website push origin HEAD:master
          fi
